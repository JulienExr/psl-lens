name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist/
          retention-days: 3

  chromium:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: chromium-failure-traces
          path: test-results/
          retention-days: 7

  pwa:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: production-build
          path: dist/
      - run: npx playwright test --config playwright.production.config.ts
      - run: npx playwright test --config playwright.pwa-update.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pwa-failure-traces
          path: |
            test-results-pwa/
            test-results-pwa-update/
          retention-days: 7

  compatibility:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Prepare Firefox software GL
        if: matrix.browser == 'firefox'
        run: sudo apt-get install --no-install-recommends -y xvfb xauth libgl1-mesa-dri libegl1 libglx-mesa0
      - name: Firefox with a virtual display and Mesa
        if: matrix.browser == 'firefox'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run --auto-servernum npm run test:compat -- --project=firefox --headed
      - name: WebKit compatibility
        if: matrix.browser == 'webkit'
        run: npm run test:compat -- --project=webkit
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.browser }}-failure-traces
          path: test-results-compat/
          retention-days: 7
